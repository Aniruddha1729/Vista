<svg xmlns="http://www.w3.org/2000/svg" viewBox="300 180 1070 480" role="img" aria-label="Vista" fill="none" style="--vs:#6abf98" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.vl-p{fill-opacity:0;stroke:var(--vs);stroke-width:5;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1;animation:vl-draw 1s cubic-bezier(.4,0,.2,1) var(--d) forwards,vl-fill .7s ease-out var(--f) forwards}
.vl-f{opacity:0;animation:vl-fadein .5s ease-out 1.5s forwards}
@keyframes vl-draw{to{stroke-dashoffset:0}}
@keyframes vl-fill{to{fill-opacity:1;stroke-opacity:0}}
@keyframes vl-fadein{to{opacity:1}}</style>
  <defs>
    <linearGradient id="sh-a" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="1370" y2="0" gradientTransform="translate(-800 0)">
      <stop offset="0" stop-color="#05573a"/><stop offset=".38" stop-color="#05573a"/><stop offset=".5" stop-color="#6abf98"/><stop offset=".62" stop-color="#05573a"/><stop offset="1" stop-color="#05573a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-800 0" to="800 0" begin="2.7s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </linearGradient>
    <linearGradient id="ag-a" gradientUnits="userSpaceOnUse" x1="520" y1="500" x2="1000" y2="215">
      <stop offset="0" stop-color="#05573a"/><stop offset="0.8" stop-color="#6abf98"/>
    </linearGradient>
    <radialGradient id="ha-a">
      <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#6abf98" stop-opacity=".9"/><stop offset="1" stop-color="#6abf98" stop-opacity="0"/>
    </radialGradient>
    <mask id="mk-a" maskUnits="userSpaceOnUse" x="300" y="180" width="1070" height="480">
      <path d="M485 503C550 455 640 350 735 280C790 240 840 220 890 218C985 215 1055 255 1097 295" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.5s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.25 1"/>
      </path>
    </mask>
  </defs>

  <!-- 1. letters: outline draws, then fill floods in, then a sheen passes over -->
  <g fill="url(#sh-a)" fill-rule="evenodd">
    <path class="vl-p" style="--d:0.1s;--f:0.9s" pathLength="1" d="M330 302H472C456 305 443 316 445 332C446 340 449 345 452 350L520 490L642 396L512 642L372 340C366 326 350 308 330 302Z"/>
    <g><circle class="vl-p" style="--d:.28s;--f:1.08s" pathLength="1" cx="748" cy="367" r="30"/><path class="vl-p" style="--d:0.28s;--f:1.08s" pathLength="1" d="M677 427C688 425 694 428 700 430L763 404L721 572C719 580 720 586 730 586C742 586 754 572 761 559L768 564C754 592 732 614 698 614C668 614 658 590 667 556L693 446C694 436 686 432 677 427Z"/></g>
    <path class="vl-p" style="--d:0.46s;--f:1.26s" pathLength="1" d="M945 418C925 405 903 401 878 401C830 401 796 430 796 468C796 500 818 515 848 534C878 553 887 563 887 578C887 596 870 606 850 606C815 606 797 565 790 528L771 596C792 603 820 612 850 612C905 612 936 590 936 560C936 540 925 528 895 512C868 494 842 478 842 452C842 432 852 412 876 412C900 412 918 435 932 472Z"/>
    <path class="vl-p" style="--d:0.64s;--f:1.44s" pathLength="1" d="M1062 336L1056 404H1111V413H1048L1022 555C1020 575 1025 585 1038 585C1055 585 1075 575 1089 561L1092 566C1078 592 1056 614 1015 614C975 614 960 590 966 553L995 413H965V404H996C1020 396 1045 372 1062 336Z"/>
    <path class="vl-p" style="--d:0.82s;--f:1.62s" pathLength="1" d="M1328 404L1290 556C1286 578 1290 587 1300 587C1314 587 1328 575 1335 562L1340 566C1326 594 1305 614 1270 614C1245 614 1232 600 1233 575L1239 540C1220 580 1195 612 1158 612C1120 612 1097 585 1097 545C1097 470 1160 400 1235 400C1255 400 1268 405 1275 415ZM1156 550C1156 575 1167 583 1180 583C1205 583 1230 545 1250 500C1262 470 1263 455 1260 442C1255 418 1240 410 1225 410C1190 410 1156 495 1156 550Z"/>
  </g>

  <!-- 2. swoosh: revealed along its own curve -->
  <path class="vl-f" fill="#6abf98" d="M450 513C520 497 590 440 642 396L482 578Z"/>
  <g mask="url(#mk-a)">
    <path fill="url(#ag-a)" d="M450 513C490 508 515 492 535 472C600 380 720 225 880 207C980 197 1060 245 1097 295C1040 243 965 222 890 230C780 240 700 320 642 396C590 440 520 497 450 513Z"/>
  </g>

  <!-- 3. glowing comet that leads the swoosh, then a ring burst at the tip -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.85;1" begin="1.5s" dur="1.1s" fill="freeze"/>
    <animateMotion path="M485 503C550 455 640 350 735 280C790 240 840 220 890 218C985 215 1055 255 1097 295" begin="1.5s" dur="1.1s" fill="freeze" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.25 1"/>
    <circle r="26" fill="url(#ha-a)"/><circle r="5" fill="#fff"/>
  </g>
  <circle cx="1097" cy="295" r="4" fill="none" stroke="#6abf98" stroke-width="3" opacity="0">
    <animate attributeName="r" from="4" to="40" begin="2.5s" dur=".8s" fill="freeze"/>
    <animate attributeName="opacity" from=".9" to="0" begin="2.5s" dur=".8s" fill="freeze"/>
  </circle>
</svg>
